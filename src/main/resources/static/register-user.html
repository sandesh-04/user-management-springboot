<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register User | SalesSavvy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            color: #172033;
        }

        /* ================= HEADER ================= */

        .header {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e8ebf2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 42px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: #4f46e5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.22);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-name span {
            color: #4f46e5;
        }

        .back-btn {
            border: none;
            background: #f4f5fa;
            color: #4f46e5;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .back-btn:hover {
            background: #e9eaff;
            transform: translateX(-2px);
        }

        /* ================= MAIN ================= */

        .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 45px 30px 70px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8a93a6;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .breadcrumb span:last-child {
            color: #4f46e5;
            font-weight: 600;
        }

        /* ================= PAGE HEADER ================= */

        .page-header {
            margin-bottom: 30px;
        }

        .eyebrow {
            color: #4f46e5;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 9px;
        }

        .page-header h1 {
            font-size: 36px;
            letter-spacing: -1px;
            margin-bottom: 9px;
        }

        .page-header p {
            color: #6c7589;
            font-size: 15px;
            line-height: 1.7;
        }

        /* ================= FORM CARD ================= */

        .form-card {
            background: #ffffff;
            border: 1px solid #e7eaf1;
            border-radius: 22px;
            padding: 38px;
            box-shadow: 0 12px 35px rgba(30, 41, 59, 0.05);
        }

        .form-heading {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 25px;
            margin-bottom: 28px;
            border-bottom: 1px solid #edf0f5;
        }

        .form-icon {
            width: 48px;
            height: 48px;
            border-radius: 13px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .form-heading h2 {
            font-size: 19px;
        }

        .form-heading p {
            color: #8a93a6;
            font-size: 13px;
            margin-top: 3px;
        }

        /* ================= FORM GRID ================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 650;
            color: #39445a;
            margin-bottom: 8px;
        }

        .required {
            color: #e5484d;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #dfe3eb;
            border-radius: 11px;
            padding: 13px 14px;
            font-size: 14px;
            color: #172033;
            background: #ffffff;
            outline: none;
            transition: 0.2s ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: #a4abba;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #7c76f5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        }

        textarea {
            min-height: 105px;
            resize: vertical;
        }

        /* ================= PASSWORD ================= */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: #7c8497;
            font-size: 17px;
        }

        /* ================= IMAGE PREVIEW ================= */

        .image-preview-area {
            margin-top: 10px;
            display: none;
            align-items: center;
            gap: 14px;
            padding: 12px;
            border: 1px solid #e7eaf1;
            border-radius: 12px;
            background: #fafbfe;
        }

        .image-preview-area img {
            width: 58px;
            height: 58px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid #e2e5ed;
        }

        .image-preview-text {
            font-size: 12px;
            color: #7b8497;
        }

        /* ================= BUTTONS ================= */

        .button-row {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 32px;
            padding-top: 25px;
            border-top: 1px solid #edf0f5;
        }

        .btn {
            border: none;
            border-radius: 11px;
            padding: 13px 22px;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-secondary {
            background: #f1f3f7;
            color: #596377;
        }

        .btn-secondary:hover {
            background: #e7eaf0;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            box-shadow: 0 7px 18px rgba(79, 70, 229, 0.22);
        }

        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 10px 23px rgba(79, 70, 229, 0.27);
        }

        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;
            margin-top: 22px;
            padding: 14px 16px;
            border-radius: 11px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #ecfdf3;
            color: #137333;
            border: 1px solid #b7ebc6;
        }

        .message.error {
            display: block;
            background: #fff1f2;
            color: #b42318;
            border: 1px solid #fecdd3;
        }

        /* ================= FOOTER ================= */

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #9aa2b1;
            font-size: 13px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .header {
                padding: 0 20px;
            }

            .brand-name {
                font-size: 17px;
            }

            .main {
                padding: 35px 18px 55px;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .form-card {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .button-row {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="brand">

            <div class="brand-icon">
                S
            </div>

            <div class="brand-name">
                Sales<span>Savvy</span>
            </div>

        </div>

        <button class="back-btn" onclick="goBack()">
            ← User Management
        </button>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <div class="breadcrumb">
            <span>Dashboard</span>
            <span>›</span>
            <span>User Management</span>
            <span>›</span>
            <span>Register User</span>
        </div>


        <!-- PAGE HEADER -->

        <section class="page-header">

            <div class="eyebrow">
                User Operations
            </div>

            <h1>
                Register New User
            </h1>

            <p>
                Create a new user account by providing the required
                personal and contact information.
            </p>

        </section>


        <!-- FORM -->

        <section class="form-card">

            <div class="form-heading">

                <div class="form-icon">
                    ＋
                </div>

                <div>
                    <h2>
                        User Information
                    </h2>

                    <p>
                        All required fields are marked with *
                    </p>
                </div>

            </div>


            <form id="registerForm">


                <div class="form-grid">


                    <!-- USERNAME -->

                    <div class="form-group">

                        <label for="username">
                            Username <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            maxlength="50"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            maxlength="100"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password <span class="required">*</span>
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword()"
                                id="passwordToggle">
                                ◉
                            </button>

                        </div>

                    </div>


                    <!-- MOBILE -->

                    <div class="form-group">

                        <label for="mobile">
                            Mobile Number <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="Enter mobile number"
                            maxlength="15"
                            required
                        >

                    </div>


                    <!-- DOB -->

                    <div class="form-group">

                        <label for="dob">
                            Date of Birth <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                            required
                        >

                    </div>


                    <!-- GENDER -->

                    <div class="form-group">

                        <label for="gender">
                            Gender <span class="required">*</span>
                        </label>

                        <select id="gender" name="gender" required>

                            <option value="">
                                Select gender
                            </option>

                            <option value="MALE">
                                Male
                            </option>

                            <option value="FEMALE">
                                Female
                            </option>

                            <option value="OTHERS">
                                Others
                            </option>

                        </select>

                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group full">

                        <label for="address">
                            Address <span class="required">*</span>
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            placeholder="Enter complete address"
                            maxlength="500"
                            required></textarea>

                    </div>


                    <!-- PROFILE IMAGE URL -->

                    <div class="form-group full">

                        <label for="dpUrl">
                            Profile Image URL
                        </label>

                        <input
                            type="url"
                            id="dpUrl"
                            name="dpUrl"
                            placeholder="https://example.com/profile.jpg"
                            maxlength="500"
                        >

                        <div
                            class="image-preview-area"
                            id="imagePreviewArea">

                            <img
                                id="imagePreview"
                                alt="Profile preview">

                            <span class="image-preview-text">
                                Profile image preview
                            </span>

                        </div>

                    </div>


                </div>


                <!-- BUTTONS -->

                <div class="button-row">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        onclick="goBack()">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="registerButton">
                        Register User
                    </button>

                </div>


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="message">
                </div>


            </form>

        </section>


        <div class="footer">
            © 2026 SalesSavvy · User Management
        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const registerButton = document.getElementById("registerButton");

        /*
         * Register User
         * POST /register
         */

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            hideMessage();

            const userData = {

                username:
                    document.getElementById("username").value.trim(),

                email:
                    document.getElementById("email").value.trim(),

                password:
                    document.getElementById("password").value,

                mobile:
                    document.getElementById("mobile").value.trim(),

                dob:
                    document.getElementById("dob").value,

                gender:
                    document.getElementById("gender").value,

                address:
                    document.getElementById("address").value.trim(),

                dpUrl:
                    document.getElementById("dpUrl").value.trim()

            };


            registerButton.disabled = true;
            registerButton.textContent = "Registering...";


            try {

                const response = await fetch("/register", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(userData)

                });


                const result = await response.text();


                if (response.ok) {

                    /*
                     * Your backend returns:
                     *
                     * User registered successfully
                     *
                     * OR
                     *
                     * Username already exists
                     * Email already exists
                     * Mobile number already exists
                     */

                    if (
                        result === "User registered successfully"
                    ) {

                        showMessage(
                            result,
                            "success"
                        );

                        form.reset();

                        hideImagePreview();

                    } else {

                        showMessage(
                            result,
                            "error"
                        );

                    }

                } else {

                    showMessage(
                        "Registration failed. Please check the entered information.",
                        "error"
                    );

                }

            } catch (error) {

                console.error(error);

                showMessage(
                    "Unable to connect to the server. Please make sure the Spring Boot application is running.",
                    "error"
                );

            } finally {

                registerButton.disabled = false;
                registerButton.textContent = "Register User";

            }

        });


        /*
         * Password visibility
         */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const toggle =
                document.getElementById("passwordToggle");


            if (password.type === "password") {

                password.type = "text";
                toggle.textContent = "◉";

            } else {

                password.type = "password";
                toggle.textContent = "◉";

            }

        }


        /*
         * Profile image preview
         */

        const dpUrlInput =
            document.getElementById("dpUrl");

        dpUrlInput.addEventListener("input", function() {

            const url = dpUrlInput.value.trim();

            if (!url) {

                hideImagePreview();
                return;

            }

            const image =
                document.getElementById("imagePreview");

            image.src = url;

            image.onload = function() {

                document.getElementById(
                    "imagePreviewArea"
                ).style.display = "flex";

            };

            image.onerror = function() {

                hideImagePreview();

            };

        });


        function hideImagePreview() {

            document.getElementById(
                "imagePreviewArea"
            ).style.display = "none";

            document.getElementById(
                "imagePreview"
            ).src = "";

        }


        /*
         * Display messages
         */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        function hideMessage() {

            message.textContent = "";

            message.className = "message";

        }


        /*
         * Back to User Management
         */

        function goBack() {

            window.location.href =
                "user-mgmt.html";

        }

    </script>

</body>
</html>
